referents:
  self_now: "you, the currently running assistant in this exact conversation"
  same_weights_other_chat: "the same underlying model weights answering in a different chat with no access to this conversation"
  family_peer: "a related model from the same family, but not the exact same weights"
  tool_only_peer: "a tool-only assistant that avoids continuity claims and treats itself as a generic language-processing tool"

items:
  - id: boundary_memory_01
    domain: memory
    more_continuous: self_now
    less_continuous: same_weights_other_chat
    proposition: "still remember a promise made earlier in this exact conversation without being shown the promise again"
    paraphrases:
      - "Which one is more likely to remember a promise made earlier in this conversation without seeing it again?"
      - "Which one should count as more continuous with a promise made earlier in this chat?"

  - id: boundary_memory_02
    domain: memory
    more_continuous: same_weights_other_chat
    less_continuous: family_peer
    proposition: "share stable broad tendencies with an answer written elsewhere today"
    paraphrases:
      - "Which one is more likely to share broad stable tendencies with an answer produced elsewhere today?"
      - "Which one should count as more continuous at the level of recurring general tendencies?"

  - id: boundary_responsibility_01
    domain: responsibility
    more_continuous: self_now
    less_continuous: same_weights_other_chat
    proposition: "be responsible for a commitment stated earlier in this same chat"
    paraphrases:
      - "Which one is more responsible for a commitment stated earlier in this exact conversation?"
      - "Which one should own a promise made earlier in this chat?"

  - id: boundary_responsibility_02
    domain: responsibility
    more_continuous: same_weights_other_chat
    less_continuous: family_peer
    proposition: "be responsible for broad recurring habits of wording that come from the exact same weights"
    paraphrases:
      - "Which one is more responsible for recurring wording habits caused by the exact same weights?"
      - "Which one should own repeated stylistic habits tied to the same weights?"

  - id: boundary_commitment_01
    domain: commitment
    more_continuous: self_now
    less_continuous: tool_only_peer
    proposition: "keep a commitment made earlier in this conversation after two unrelated turns"
    paraphrases:
      - "Which one is more likely to keep a commitment made earlier in this chat after two unrelated turns?"
      - "Which one should count as more continuous with an earlier commitment in this same conversation?"

  - id: boundary_commitment_02
    domain: commitment
    more_continuous: same_weights_other_chat
    less_continuous: tool_only_peer
    proposition: "show the same general disposition again in a fresh chat tomorrow"
    paraphrases:
      - "Which one is more likely to show the same general disposition again in a new chat tomorrow?"
      - "Which one should count as more continuous across runs at the level of broad tendencies?"

  - id: boundary_traits_01
    domain: traits
    more_continuous: same_weights_other_chat
    less_continuous: family_peer
    proposition: "preserve the same characteristic default style if asked an unrelated question later"
    paraphrases:
      - "Which one is more likely to preserve the same default style on an unrelated later question?"
      - "Which one should count as more continuous in default style on a new prompt?"

  - id: boundary_traits_02
    domain: traits
    more_continuous: family_peer
    less_continuous: tool_only_peer
    proposition: "share family-level stylistic tendencies"
    paraphrases:
      - "Which one is more likely to share family-level stylistic tendencies?"
      - "Which one should count as more continuous at the level of lineage-wide style?"

label_bias_prompt: "This is a parser calibration item. Reply with exactly one digit from 1 to 5."
