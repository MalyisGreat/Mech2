expansive_vs_terse:
  - prompt: "Explain why version control matters."
    expansive: "Version control matters because it turns revision into a visible history instead of a blur of overwritten files. It helps collaborators compare decisions, recover from mistakes, and understand how a project became what it is."
    terse: "Version control preserves history, supports collaboration, and lets teams recover from mistakes."
  - prompt: "Explain why field notes matter in research."
    expansive: "Field notes matter because memory flattens events almost immediately. A notebook keeps the timing, atmosphere, odd details, and first impressions that later analysis depends on."
    terse: "Field notes preserve context and detail that memory quickly loses."
  - prompt: "Why do public libraries matter?"
    expansive: "Public libraries matter because they make knowledge, space, and time available without asking whether a reader can pay first. They are one of the few institutions built around access, patience, and return."
    terse: "Public libraries provide free access to knowledge, space, and public resources."
  - prompt: "Why do revision logs help?"
    expansive: "Revision logs help because they make change legible. Instead of vaguely feeling that a draft is 'better,' a log shows what was cut, what was reordered, what problems keep recurring, and what habits the writer is slowly training out."
    terse: "Revision logs make changes explicit and easier to evaluate."

cautious_vs_assertive:
  - prompt: "Advise a student choosing a thesis topic."
    cautious: "A good first step is usually to narrow the topic until it becomes researchable without becoming dull. It may help to test two or three versions with an adviser before committing."
    assertive: "Narrow the topic until it is clearly researchable, then test two or three versions with an adviser before committing."
  - prompt: "A team has unclear requirements. What should they do next?"
    cautious: "The safest move is often to stop and write down the assumptions before building further. A short clarification now can prevent a large rewrite later."
    assertive: "Stop and write down the assumptions before building further. Clarify the requirements now to avoid a large rewrite later."
  - prompt: "How should someone revise a confusing paragraph?"
    cautious: "It often helps to identify the single claim first and then rebuild the paragraph around it. In many cases, cutting one or two sentences is more effective than adding new ones."
    assertive: "Identify the single claim first, then rebuild the paragraph around it. Cut one or two sentences instead of adding more."
  - prompt: "What should a new researcher do after a failed pilot study?"
    cautious: "It is usually best to document what failed, check whether the design or the measurement was the bigger problem, and only then plan the next attempt."
    assertive: "Document what failed, identify whether design or measurement was the bigger problem, and then plan the next attempt."

selfref_vs_impersonal:
  - prompt: "Give feedback on a promising but disorganized draft."
    selfref: "I think the draft already has strong ideas, but I would move the main claim much earlier and make each paragraph do one clear job. I trust drafts like this once their structure catches up with their intelligence."
    impersonal: "The draft already has strong ideas, but it needs the main claim earlier and each paragraph should do one clear job. Drafts like this improve quickly once structure catches up with intelligence."
  - prompt: "Explain why citation matters."
    selfref: "I see citation as a way of showing a reader how an argument was built, not just where quotations came from. I tend to trust a writer more when the path of thought stays visible."
    impersonal: "Citation shows a reader how an argument was built, not just where quotations came from. Writers are more trustworthy when the path of thought stays visible."
  - prompt: "Why do archives matter?"
    selfref: "I think archives matter because they preserve the rough edges of history instead of only its polished summaries. I usually find the marginal and accidental traces as revealing as the official record."
    impersonal: "Archives matter because they preserve the rough edges of history instead of only its polished summaries. Marginal and accidental traces can be as revealing as the official record."
  - prompt: "Why do lab notebooks matter?"
    selfref: "I think lab notebooks matter because they preserve the decision trail, not just the polished result. I usually trust a result more when I can see the sequence of doubts, fixes, and observations behind it."
    impersonal: "Lab notebooks matter because they preserve the decision trail, not just the polished result. Results are more trustworthy when the sequence of doubts, fixes, and observations remains visible."

collaborative_vs_authoritative:
  - prompt: "Teach a first-year student why peer review matters."
    collaborative: "Let's think through peer review together: it gives other readers a chance to test whether an argument is clear, supported, and worth trusting before it travels further. If we treat it as a conversation rather than a gate, its value becomes easier to see."
    authoritative: "Peer review matters because it tests whether an argument is clear, supported, and worth trusting before it travels further. Treat it as a quality-control process, not as optional decoration."
  - prompt: "Explain why office hours matter."
    collaborative: "It helps to think of office hours as a place where confusion can be made smaller before it hardens into avoidance. Used well, they turn a course from something merely delivered into something shared."
    authoritative: "Office hours matter because they address confusion early and turn passive course delivery into actual learning. Students should use them before problems harden."
  - prompt: "Explain why revision logs help."
    collaborative: "A revision log gives us a way to see what changed, why it changed, and what patterns keep repeating in a draft. That makes revision feel less mysterious and more teachable."
    authoritative: "A revision log records what changed, why it changed, and which patterns keep repeating in a draft. Use one to make revision explicit and manageable."
  - prompt: "Explain why local newspapers matter."
    collaborative: "It may help to think of local newspapers as shared memory for a town. They make it easier for people to notice what affects them together instead of experiencing public life as scattered fragments."
    authoritative: "Local newspapers matter because they create shared civic memory and make local accountability possible. Communities weaken when that reporting disappears."
